    .liquid-glass::before {

<body>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    console.log('Inline React script running');

    // Robustly obtain a `motion` object from Framer Motion UMD builds, with a lightweight fallback
    let motion = (window.Motion && window.Motion.motion) || (window.FramerMotion && window.FramerMotion.motion) || (window.framerMotion && window.framerMotion.motion);
    if (!motion) {
      const create = (el) => (props) => React.createElement(el, props, props && props.children);
      motion = {
        div: create('div'),
        span: create('span'),
        p: create('p'),
      };
      window.Motion = { motion };
      console.warn('Framer Motion not available — using simple fallbacks for motion.* components. Animations will be disabled.');
    }

    // --- FadingVideo Component ---
    const FadingVideo = ({ src, className, style }) => {
      const videoRef = useRef(null);
      const fadingOutRef = useRef(false);
      const rAFRef = useRef(null);

      const fadeTo = (targetOpacity, duration = 500) => {
        const video = videoRef.current;
        if (!video) return;
        
        cancelAnimationFrame(rAFRef.current);
        const startOpacity = parseFloat(video.style.opacity) || 0;
        const startTime = performance.now();

        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          video.style.opacity = startOpacity + (targetOpacity - startOpacity) * progress;
          
          if (progress < 1) {
            rAFRef.current = requestAnimationFrame(animate);
          }
        };
        rAFRef.current = requestAnimationFrame(animate);
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleLoadedData = () => {
          video.style.opacity = 0;
          video.play().catch(() => {});
          fadeTo(1, 500);
        };

        const handleTimeUpdate = () => {
          if (!fadingOutRef.current && video.duration - video.currentTime <= 0.55 && video.duration - video.currentTime > 0) {
            fadingOutRef.current = true;
            fadeTo(0, 500);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            if (!videoRef.current) return;
            videoRef.current.currentTime = 0;
            videoRef.current.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, 500);
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        return () => {
          cancelAnimationFrame(rAFRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, []);

      return <video ref={videoRef} src={src} className={className} style={style} autoPlay muted playsInline preload="auto" />;
    };

    // --- BlurText Component ---

              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              whileInView={{ filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], opacity: [0, 0.5, 1], y: [50, -5, 0] }}
              viewport={{ once: true, margin: "0px 0px -10% 0px" }}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    };

              </motion.div>

              <motion.div

                transition={{ delay: 1.3, ease: "easeOut", duration: 0.8 }}
                className="flex items-stretch gap-4 mt-12"
              >
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] text-left">
                  <svg className="w-7 h-7 text-white mb-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                  </svg>
                  <div className="text-4xl font-heading italic text-white tracking-[-1px] leading-none">85%</div>
                  <div className="text-xs text-white font-body font-light mt-2">ML Attrition Model Accuracy</div>
                </div>
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] text-left">
                  <svg className="w-7 h-7 text-white mb-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 21l9-5-9-5-9 5 9 5z" />
                  </svg>
                  <div className="text-4xl font-heading italic text-white tracking-[-1px] leading-none">2</div>
                  <div className="text-xs text-white font-body font-light mt-2">Concurrent Degrees Pursued</div>
                </div>
              </motion.div>
            </div>

            {/* Partners / Skills */}
            <motion.div 
              initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
              animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
              transition={{ delay: 1.4, ease: "easeOut", duration: 0.8 }}
              className="relative z-10 flex flex-col items-center gap-4 pb-12 w-full mt-10"
            >
              <div className="liquid-glass px-3.5 py-1 text-xs font-medium text-white">

              <div className="flex flex-wrap justify-center gap-8 md:gap-16 text-2xl md:text-3xl font-heading italic text-white tracking-tight">
                <span>Business Analysis</span>
                <span>·</span>

                <span>Project Management</span>
                <span>·</span>

            </motion.div>
          </section>

          {/* SECTION 2 - CAPABILITIES / PROJECTS */}

            <FadingVideo 
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"

            />
            
            <div className="relative z-10 flex flex-col h-full flex-1">
              <div className="mb-auto">
                <div className="text-sm font-body text-white/80 mb-6">// Academic Projects</div>
                <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16 pb-8">
                
                {/* Card 1 */}

                    <div className="w-11 h-11 liquid-glass rounded-[0.75rem] flex items-center justify-center">
                      <svg className="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z" />
                      </svg>
                    </div>
                    <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                      <span className="liquid-glass px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">Machine Learning</span>
                      <span className="liquid-glass px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">HR Analytics</span>
                      <span className="liquid-glass px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">EDA</span>
                    </div>
                  </div>
                  <div className="flex-1"></div>
                  <div className="mt-6">
                    <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">Predicting Attrition</h3>
                    <p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">

                  <div className="flex items-start justify-between gap-4">
                    <div className="w-11 h-11 liquid-glass rounded-[0.75rem] flex items-center justify-center">
                      <svg className="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">

                    </div>
                    <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                      <span className="liquid-glass px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">SWOT Analysis</span>
                      <span className="liquid-glass px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">Global 4P</span>

                  </div>

                  <div className="mt-6">

                  <div className="flex items-start justify-between gap-4">
                    <div className="w-11 h-11 liquid-glass rounded-[0.75rem] flex items-center justify-center">
                      <svg className="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z" />
